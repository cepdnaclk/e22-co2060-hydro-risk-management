name: 🐛 Bug Report
description: Report a bug or unexpected behavior in ATLAS
title: "[Bug]: "
labels: ["bug", "needs-triage"]
assignees: []

body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug! Please fill out the form below as completely as possible.
        Before submitting, please [search existing issues](https://github.com/cepdnaclk/e22-co2060-hydro-risk-management/issues) to avoid duplicates.

  - type: dropdown
    id: service
    attributes:
      label: Affected Service
      description: Which service/component is affected?
      multiple: true
      options:
        - Frontend (React Dashboard)
        - MQTT Ingestion Service (:8091)
        - Metadata Service (:8092)
        - Alerting Service (:8093)
        - Report Service (:8094)
        - User/Auth Service (:8096)
        - GIS Monitoring Service (:8097)
        - Docker Compose / Infrastructure
        - Documentation
        - Other
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is.
      placeholder: "When I do X, Y happens instead of Z..."
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: Exact steps to reproduce the behavior.
      placeholder: |
        1. Start services with `docker compose up -d`
        2. Navigate to http://localhost:8090
        3. Click on '...'
        4. See error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: What actually happened? Include screenshots if applicable.
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant Logs
      description: |
        Please paste relevant log output. Run `docker compose logs <service-name>` to get logs.
      render: shell
      placeholder: "Paste log output here..."

  - type: input
    id: docker-version
    attributes:
      label: Docker Version
      placeholder: "docker --version"

  - type: input
    id: os
    attributes:
      label: Operating System
      placeholder: "e.g., Ubuntu 22.04, macOS 14, Windows 11"

  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I have searched existing issues and this is not a duplicate
          required: true
        - label: I have included all relevant logs and error messages
          required: true
