services:
  db:
    image: timescale/timescaledb:latest-pg14
    container_name: master_timescaledb
    environment:
      POSTGRES_DB: kernelx
      POSTGRES_USER: kernelx
      POSTGRES_PASSWORD: kernelx
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data

  redis:
    image: redis:latest
    container_name: redis_cache
    ports:
      - "6379:6379"

  metadata-handling-service:
    build: ./metadata-handling-service
    container_name: metadata-handling-service
    ports:
      - "8092:8092"
    depends_on:
      - db
      - redis
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/kernelx
      SPRING_DATASOURCE_USERNAME: kernelx
      SPRING_DATASOURCE_PASSWORD: kernelx
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379

  alerting-service:
    build: ./disaster-management-alerting-service
    container_name: alerting-service
    ports:
      - "8093:8093"
    depends_on:
      - db
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/kernelx
      SPRING_DATASOURCE_USERNAME: kernelx
      SPRING_DATASOURCE_PASSWORD: kernelx

  mqtt-service:
    build: ./mqtt-data-ingestion-service/mqttSubscriber
    container_name: mqtt-subscriber-service
    ports:
      - "8091:8091"
    depends_on:
      - db
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/kernelx
      SPRING_DATASOURCE_USERNAME: kernelx
      SPRING_DATASOURCE_PASSWORD: kernelx

  report-generating-service:
    build: ./report-generating-service
    container_name: report-generating-service
    ports:
      - "8094:8094"
    depends_on:
      - db
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/kernelx
      SPRING_DATASOURCE_USERNAME: kernelx
      SPRING_DATASOURCE_PASSWORD: kernelx
      SPRING_JPA_HIBERNATE_DDL_AUTO: update

  user-service:
    build: ./disaster-management-user-service
    container_name: user-service
    ports:
      - "8096:8096"
    depends_on:
      - db
      - redis
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/kernelx
      SPRING_DATASOURCE_USERNAME: kernelx
      SPRING_DATASOURCE_PASSWORD: kernelx
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379

  gis-monitoring-service:
    build: ./gis-monitoring-service
    container_name: gis-monitoring-service
    ports:
      - "8097:8097"
    depends_on:
      - db
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/kernelx
      SPRING_DATASOURCE_USERNAME: kernelx
      SPRING_DATASOURCE_PASSWORD: kernelx

  frontend:
    build: ./disaster-management-frontend
    container_name: frontend
    ports:
      - "8090:80"
    depends_on:
      - alerting-service
      - mqtt-service
      - metadata-handling-service
      - user-service

volumes:
  db_data: